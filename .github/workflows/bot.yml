name: TG Message Bot

on:
  schedule:
    # 每 5 分钟拉起一轮（GitHub 免费额度最小粒度，实际可能排队延迟几分钟）
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      run_seconds:
        description: "单轮轮询秒数（默认 270）"
        required: false
        default: "270"

# 同一时间只允许一轮在跑，避免两条流水线抢 getUpdates 导致重复转发
concurrency:
  group: tg-message-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secret
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then echo "缺少 secret: BOT_TOKEN"; exit 1; fi

      - name: Poll and forward
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          RUN_SECONDS: ${{ github.event.inputs.run_seconds || '270' }}
          ACK: "0"
        run: python3 poll_bot.py

      - name: Persist state
        run: |
          git config user.name "tg-message-bot"
          git config user.email "tg-message-bot@users.noreply.github.com"
          ls -l data 2>/dev/null || echo "no data dir"
          git add -A data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state $(date -u +%FT%TZ)"
            git push || (git pull --rebase --autostash && git push)
            echo "state committed"
          else
            echo "no state change"
          fi

      # 关键：本轮结束立刻排下一轮，形成近乎不间断的轮询链，不依赖 GitHub cron
      - name: Chain next run
        if: always()
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/bot.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "next run dispatch: $code"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
